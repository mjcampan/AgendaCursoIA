<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agenda de Mauricio</title>
<style>
  :root{
    color-scheme: light dark;
    --paper:#f5f4f0; --surface:#fdfcf9; --ink:#17181a; --ink-2:#3c3d41;
    --muted:#6c6d73; --faint:#96979d; --rule:#d8d5cd; --rule-2:#e6e3da;
    --accent:#0e5f52; --check:#0e5f52; --bad:#9c2b2b;
    --sans:"Inter Tight","Segoe UI Variable Display","SF Pro Display",-apple-system,"Segoe UI","Ubuntu","Noto Sans",sans-serif;
    --mono:"JetBrains Mono","IBM Plex Mono","SFMono-Regular",ui-monospace,"DejaVu Sans Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#121316; --surface:#17191d; --ink:#f1f0eb; --ink-2:#cfcec8;
      --muted:#9d9ea6; --faint:#82838c; --rule:#2c2e35; --rule-2:#212329;
      --accent:#5ad3ba; --check:#1c6b5d; --bad:#e08585;
    }
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .hoja{max-width:780px;margin:0 auto;padding:34px 24px 56px}

  /* encabezado */
  header.arriba{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;
    justify-content:space-between;padding-bottom:13px;border-bottom:2px solid var(--ink)}
  h1{font-size:clamp(20px,2.6vw,26px);margin:0;letter-spacing:-.025em;font-weight:650}
  #fecha{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0}

  /* alta, siempre a mano */
  .alta{
    position:sticky;top:0;z-index:4;display:flex;gap:8px;flex-wrap:wrap;
    padding:14px 0 12px;background:var(--paper);border-bottom:1px solid var(--rule);
  }
  #texto{flex:1 1 240px;min-width:0}
  input[type=text],select{font-family:inherit;font-size:13.5px;color:var(--ink);
    background:var(--surface);border:1px solid var(--rule);border-radius:2px;
    padding:10px 11px;min-height:44px}
  input[type=text]::placeholder{color:var(--faint)}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #agregar{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:2px;
    padding:10px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
  #agregar:hover{background:var(--accent);border-color:var(--accent)}
  .error{color:var(--bad);font-size:12px;margin:8px 0 0;flex-basis:100%}

  /* columnas */
  main{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;column-gap:44px}
  section{grid-column:span 1}
  section.ancha{grid-column:1/-1;margin-top:26px}

  .colhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    font-weight:650;margin:0}
  .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
  .prog{height:2px;background:var(--rule-2);border-radius:1px}
  .prog i{display:block;height:2px;background:var(--accent);border-radius:1px;
    transition:width .45s cubic-bezier(.22,1,.36,1)}

  ul{list-style:none;margin:0;padding:0}
  li{display:flex;gap:12px;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--rule-2);min-height:46px}
  li:last-child{border-bottom:0}
  li input[type=checkbox]{width:18px;height:18px;accent-color:var(--check);
    cursor:pointer;margin:0;flex:0 0 auto}
  .tx{flex:1;min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
  li.hecha .tx{color:var(--faint);text-decoration:line-through}
  .f{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto}
  .f:empty{display:none}

  .x{background:transparent;border:0;color:var(--faint);font-size:17px;line-height:1;
    cursor:pointer;padding:6px;min-width:28px;min-height:28px;flex:0 0 auto;border-radius:2px}
  .x:hover{color:var(--bad)}
  @media (hover:hover) and (pointer:fine){
    .x{opacity:.4;transition:opacity .12s ease}
    li:hover .x, .x:focus-visible{opacity:1}
  }

  li.sep{display:block;padding:16px 0 6px;border-bottom:0;min-height:0}
  li.sep span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
    letter-spacing:.12em;color:var(--faint)}
  li.vacio{display:block;padding:14px 0;border-bottom:0;min-height:0;
    color:var(--faint);font-size:12.5px}
  li.vacio b{color:var(--muted);font-weight:600}

  footer{margin-top:30px;padding-top:12px;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:10.5px;color:var(--faint);
    display:flex;flex-wrap:wrap;gap:6px 16px}
  footer span::before{content:"·";margin-right:16px;color:var(--rule)}
  footer span:first-child::before{content:none;margin:0}

  @media (max-width:640px){
    .hoja{padding:22px 16px 44px}
    main{grid-template-columns:1fr;row-gap:26px}
    section.ancha{margin-top:0}
    #texto{flex:1 1 100%}
    #agregar{flex:1}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="hoja">

  <header class="arriba">
    <h1>Agenda de Mauricio</h1>
    <p id="fecha"></p>
  </header>

  <form class="alta" id="form">
    <input id="texto" type="text" placeholder="¿Qué tenés que hacer?" autocomplete="off"
      maxlength="200" aria-label="Texto de la tarea">
    <select id="cuando" aria-label="Para cuándo">
      <option value="hoy">Hoy</option>
      <option value="manana">Mañana</option>
    </select>
    <button id="agregar" type="submit">Agregar</button>
    <p class="error" id="error" hidden></p>
  </form>

  <main>
    <section>
      <div class="colhead">
        <h2>Hoy</h2><span class="n" id="nHoy"></span>
      </div>
      <div class="prog"><i id="progHoy" style="width:0"></i></div>
      <ul id="listaHoy"></ul>
    </section>

    <section>
      <div class="colhead">
        <h2>Mañana</h2><span class="n" id="nManana"></span>
      </div>
      <div class="prog"><i id="progManana" style="width:0"></i></div>
      <ul id="listaManana"></ul>
    </section>

    <section class="ancha" id="bloqueOtras" hidden>
      <div class="colhead">
        <h2>Otras fechas</h2><span class="n" id="nOtras"></span>
      </div>
      <ul id="listaOtras"></ul>
    </section>
  </main>

  <footer>
    <span>guardado en agenda.db</span>
    <span>funciona sin internet</span>
  </footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const hoyTexto = new Intl.DateTimeFormat('es-EC', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  }).format(new Date());
  $('fecha').textContent = hoyTexto.charAt(0).toUpperCase() + hoyTexto.slice(1);

  function fila(t, conFecha) {
    const texto = esc(t.texto);
    return '<li class="' + (t.hecha ? 'hecha' : '') + '" data-id="' + t.id + '">' +
      '<input type="checkbox" ' + (t.hecha ? 'checked ' : '') +
        'aria-label="Marcar «' + texto + '» como hecha">' +
      '<span class="tx">' + texto + '</span>' +
      '<span class="f">' + (conFecha ? esc(t.fecha) : '') + '</span>' +
      '<button class="x" type="button" aria-label="Borrar «' + texto + '»">&times;</button>' +
    '</li>';
  }

  // pendientes arriba, hechas abajo separadas por una marca
  function bloque(tareas, conFecha, vacio) {
    if (!tareas.length) return '<li class="vacio">' + vacio + '</li>';
    const pendientes = tareas.filter((t) => !t.hecha);
    const hechas = tareas.filter((t) => t.hecha);
    let html = pendientes.map((t) => fila(t, conFecha)).join('');
    if (hechas.length) {
      html += '<li class="sep" role="presentation"><span>hechas</span></li>';
      html += hechas.map((t) => fila(t, conFecha)).join('');
    }
    return html;
  }

  function medir(lista) {
    const total = lista.length;
    const hechas = lista.filter((t) => t.hecha).length;
    return { total, hechas, pendientes: total - hechas };
  }

  function pintar(v) {
    $('listaHoy').innerHTML = bloque(v.hoy, false,
      'Nada para hoy. <b>Agregá una tarea arriba</b> y aparece acá.');
    $('listaManana').innerHTML = bloque(v.manana, false,
      'Nada para mañana. Elegí «Mañana» al agregar.');

    const otras = v.otras || [];
    $('bloqueOtras').hidden = otras.length === 0;
    $('listaOtras').innerHTML = otras.map((t) => fila(t, true)).join('');

    const hoy = medir(v.hoy);
    const manana = medir(v.manana);

    $('nHoy').textContent = hoy.total ? hoy.hechas + ' de ' + hoy.total + ' hechas' : 'sin tareas';
    $('nManana').textContent = manana.total ? manana.hechas + ' de ' + manana.total + ' hechas' : 'sin tareas';
    $('nOtras').textContent = otras.length === 1 ? '1 tarea' : otras.length + ' tareas';
    $('progHoy').style.width = hoy.total ? (hoy.hechas / hoy.total) * 100 + '%' : '0';
    $('progManana').style.width = manana.total ? (manana.hechas / manana.total) * 100 + '%' : '0';
  }

  async function cargar() {
    const r = await fetch('/api/tareas');
    if (!r.ok) throw new Error('No se pudo leer la agenda');
    pintar(await r.json());
  }

  function mostrarError(texto) {
    const e = $('error');
    e.textContent = texto;
    e.hidden = !texto;
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = $('texto').value.trim();
    if (!texto) { mostrarError('Escribí una tarea antes de agregar.'); return; }
    mostrarError('');
    const r = await fetch('/api/tareas', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ texto, cuando: $('cuando').value }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      mostrarError(j.error || 'No se pudo agregar');
      return;
    }
    $('texto').value = '';
    $('texto').focus();
    await cargar();
  });

  async function conFila(evento, accion) {
    const li = evento.target.closest('li[data-id]');
    if (!li) return;
    await accion(Number(li.dataset.id), li);
    await cargar();
  }

  ['listaHoy', 'listaManana', 'listaOtras'].forEach((id) => {
    $(id).addEventListener('change', (e) => {
      if (e.target.type !== 'checkbox') return;
      conFila(e, (n) => fetch('/api/tareas/' + n, {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ hecha: e.target.checked }),
      }));
    });
    $(id).addEventListener('click', (e) => {
      if (!e.target.classList.contains('x')) return;
      conFila(e, (n) => fetch('/api/tareas/' + n, { method: 'DELETE' }));
    });
  });

  cargar().catch((e) => mostrarError(e.message));
</script>
</body>
</html>
