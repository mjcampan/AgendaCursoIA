<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de Mauricio</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fdfcf9; --ink:#17181a; --ink-2:#3c3d41;
    --muted:#6c6d73; --faint:#96979d; --rule:#d8d5cd; --rule-2:#e6e3da;
    --accent:#0e5f52; --bad:#9c2b2b;
    --sans:"Inter Tight","Segoe UI Variable Display","SF Pro Display",-apple-system,"Segoe UI","Ubuntu","Noto Sans",sans-serif;
    --mono:"JetBrains Mono","IBM Plex Mono","SFMono-Regular",ui-monospace,"DejaVu Sans Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .hoja{max-width:780px;margin:0 auto;padding:34px 24px 60px}

  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
    padding-bottom:14px;border-bottom:2px solid var(--ink)}
  h1{font-size:clamp(20px,2.6vw,26px);margin:0;letter-spacing:-.025em;font-weight:650}
  #fecha{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0}

  form{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
  #texto{flex:1 1 260px;min-width:0}
  input[type=text],select{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
    border:1px solid var(--rule);border-radius:2px;padding:10px 11px;min-height:42px}
  input[type=text]::placeholder{color:var(--faint)}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #agregar{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:2px;
    padding:10px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:42px}
  #agregar:hover{background:var(--accent);border-color:var(--accent)}
  .error{color:var(--bad);font-size:12px;margin:6px 0 0}

  main{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
  section{grid-column:span 1}
  section.ancha{grid-column:1/-1;margin-top:22px}
  h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0;
    font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    font-weight:650;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  h2 .n{font-family:var(--mono);font-size:10.5px;letter-spacing:0;color:var(--faint)}

  ul{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:18px 1fr auto 22px;gap:10px;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--rule-2);min-height:44px}
  li:last-child{border-bottom:0}
  li input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:0}
  .tx{color:var(--ink-2);overflow-wrap:anywhere}
  li.hecha .tx{color:var(--faint);text-decoration:line-through}
  .f{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .x{background:transparent;border:0;color:var(--faint);font-size:16px;line-height:1;cursor:pointer;
    padding:4px;min-width:24px;min-height:24px}
  .x:hover{color:var(--bad)}
  .vacio{color:var(--faint);font-size:12px;padding:12px 0}

  footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
  footer b{color:var(--ink);font-weight:600}

  @media (max-width:640px){
    .hoja{padding:24px 16px 48px}
    main{grid-template-columns:1fr;row-gap:22px}
  }
</style>
</head>
<body>
<div class="hoja">

  <header>
    <h1>Agenda de Mauricio</h1>
    <p id="fecha"></p>
  </header>

  <form id="form">
    <input id="texto" type="text" placeholder="¿Qué tenés que hacer?" autocomplete="off" maxlength="200" aria-label="Texto de la tarea">
    <select id="cuando" aria-label="Para cuándo">
      <option value="hoy">Hoy</option>
      <option value="manana">Mañana</option>
    </select>
    <button id="agregar" type="submit">Agregar</button>
  </form>
  <p class="error" id="error" hidden></p>

  <main>
    <section>
      <h2>Hoy<span class="n" id="nHoy"></span></h2>
      <ul id="listaHoy"></ul>
    </section>
    <section>
      <h2>Mañana<span class="n" id="nManana"></span></h2>
      <ul id="listaManana"></ul>
    </section>
    <section class="ancha" id="bloqueOtras" hidden>
      <h2>Otras fechas<span class="n" id="nOtras"></span></h2>
      <ul id="listaOtras"></ul>
    </section>
  </main>

  <footer id="resumen"></footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const hoyTexto = new Intl.DateTimeFormat('es-EC', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  }).format(new Date());
  $('fecha').textContent = hoyTexto.charAt(0).toUpperCase() + hoyTexto.slice(1);

  function fila(t) {
    return '<li class="' + (t.hecha ? 'hecha' : '') + '" data-id="' + t.id + '">' +
      '<input type="checkbox" ' + (t.hecha ? 'checked ' : '') + 'aria-label="Marcar como hecha">' +
      '<span class="tx">' + esc(t.texto) + '</span>' +
      '<span class="f">' + esc(t.fecha) + '</span>' +
      '<button class="x" type="button" aria-label="Borrar tarea">&times;</button>' +
    '</li>';
  }

  function lista(html, tareas) {
    return tareas.length ? tareas.map(fila).join('') : '<li class="vacio">Sin tareas.</li>';
  }

  function pintar(v) {
    $('listaHoy').innerHTML = lista(null, v.hoy);
    $('listaManana').innerHTML = lista(null, v.manana);
    const otras = v.otras || [];
    $('bloqueOtras').hidden = otras.length === 0;
    $('listaOtras').innerHTML = otras.map(fila).join('');

    const pend = (l) => l.filter((t) => !t.hecha).length;
    $('nHoy').textContent = pend(v.hoy) + ' pendientes';
    $('nManana').textContent = pend(v.manana) + ' pendientes';
    $('nOtras').textContent = otras.length + ' tareas';

    const r = v.resumen || { totalPendientes: 0, totalHechas: 0, hoyPendientes: 0, mananaPendientes: 0 };
    $('resumen').innerHTML =
      '<span><b>' + r.totalPendientes + '</b> pendientes (hoy ' + r.hoyPendientes +
      ' · mañana ' + r.mananaPendientes + ')</span>' +
      '<span><b>' + r.totalHechas + '</b> hechas</span>' +
      '<span>guardado en agenda.db</span>';
  }

  async function cargar() {
    const r = await fetch('/api/tareas');
    if (!r.ok) throw new Error('No se pudo leer la agenda');
    pintar(await r.json());
  }

  function mostrarError(texto) {
    const e = $('error');
    e.textContent = texto;
    e.hidden = !texto;
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = $('texto').value.trim();
    if (!texto) { mostrarError('Escribí una tarea antes de agregar.'); return; }
    mostrarError('');
    const r = await fetch('/api/tareas', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ texto, cuando: $('cuando').value }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      mostrarError(j.error || 'No se pudo agregar');
      return;
    }
    $('texto').value = '';
    $('texto').focus();
    await cargar();
  });

  async function conFila(evento, accion) {
    const li = evento.target.closest('li[data-id]');
    if (!li) return;
    await accion(Number(li.dataset.id), li);
    await cargar();
  }

  ['listaHoy', 'listaManana', 'listaOtras'].forEach((id) => {
    $(id).addEventListener('change', (e) => {
      if (e.target.type !== 'checkbox') return;
      conFila(e, (n) => fetch('/api/tareas/' + n, {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ hecha: e.target.checked }),
      }));
    });
    $(id).addEventListener('click', (e) => {
      if (!e.target.classList.contains('x')) return;
      conFila(e, (n) => fetch('/api/tareas/' + n, { method: 'DELETE' }));
    });
  });

  cargar().catch((e) => mostrarError(e.message));
</script>
</body>
</html>
